# .github/workflows/build.yml
name: Build & Push

on:
  push:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # These should be set as GitHub Action Secrets
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SA_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and push all services
        run: |
          TAG=${{ github.sha }}
          PROJECT_ID=${{ secrets.GCP_PROJECT_ID }}
          
          # List of services to build
          SERVICES=(
            "api-gateway" "auth-service" "catalog-service" "order-service" 
            "payment-service" "notification-service" "collection-service" 
            "pincode-service" "return-service" "search-service" 
            "inventory-service" "admin-service" "support-service" "frontend"
          )
          
          for SERVICE in "${SERVICES[@]}"; do
            # Only build if the directory exists (prevents failure during initial setup)
            DIR=""
            if [ "$SERVICE" == "frontend" ]; then
              DIR="frontend"
            else
              DIR="services/$SERVICE"
            fi
            
            if [ -d "$DIR" ]; then
              echo "Building $SERVICE..."
              docker build -t asia-south1-docker.pkg.dev/$PROJECT_ID/fabricspeaks/$SERVICE:$TAG \
                -f $DIR/Dockerfile .
              docker push asia-south1-docker.pkg.dev/$PROJECT_ID/fabricspeaks/$SERVICE:$TAG
            else
              echo "Directory $DIR not found, skipping $SERVICE."
            fi
          done

      - name: Save image tag
        run: echo ${{ github.sha }} > image-tag.txt

      - uses: actions/upload-artifact@v4
        with:
          name: image-tag
          path: image-tag.txt
